<section class="yin-stats-section tracked-block" [attr.id]="block().id">
  <div class="yin-container">
    <div class="stats-grid">
      @for (item of block().items; track item.label) {
        <div class="stat-card yin-card">
          <div class="stat-num">{{ item.number }}</div>
          <div class="stat-name">{{ item.label }}</div>
          <div class="stat-desc">{{ item.description }}</div>
        </div>
      }
    </div>
  </div>
</section>
