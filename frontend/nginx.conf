map $http_x_forwarded_proto $yin_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# ==============================================================================
# ROUTE & SITEMAP WHITELIST
# Chỉ cho phép các route hợp lệ của website Yin, sitemap, API và static assets.
# Toàn bộ các URL khác (đặc biệt là link rút gọn cũ của chủ trước) đều trả về 410.
# ==============================================================================
map $uri $is_allowed_route {
    default 0;

    # 1. Trang chủ
    "/" 1;

    # 2. Các trang công khai trong sitemap & router
    "~*^/about/?$" 1;
    "~*^/projects/?$" 1;
    "~*^/blog(/.*)?$" 1;
    "~*^/contact/?$" 1;
    "~*^/privacy/?$" 1;
    "~*^/terms/?$" 1;
    "~*^/chinh-sach-bao-mat/?$" 1;

    # 3. Phân hệ Client & Admin
    "~*^/register/?$" 1;
    "~*^/login/?$" 1;
    "~*^/account(/.*)?$" 1;
    "~*^/admin(/.*)?$" 1;

    # 4. Các trang mã lỗi giao diện
    "~*^/(403|404|410|510)/?$" 1;
    "~*^/(410\.html|50x\.html)$" 1;

    # 5. Các file cấu hình root & SEO sitemap
    "~*^/(favicon\.ico|robots\.txt|sitemap\.xml|llms\.txt|manifest\.webmanifest)$" 1;

    # 6. Các thư mục nội dung tĩnh, API và dịch vụ mở rộng
    "~*^/assets/" 1;
    "~*^/public/assets/" 1;
    "~*^/api/" 1;
    "~*^/bot-auto" 1;

    # 7. File bundle tĩnh (JS, CSS, fonts, images) do Angular sinh ra
    "~*\\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest|txt|xml|html)$" 1;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 50m;

    # Cấu hình trang lỗi 410 Gone chuẩn SEO & thân thiện người dùng
    error_page 410 /410.html;
    location = /410.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Fallback cho các request gọi tiền tố /public/assets/
    location ^~ /public/assets/ {
        rewrite ^/public/assets/(.*)$ /assets/$1 last;
    }

    # Phục vụ thư mục assets trực tiếp với cache cao, bỏ qua kiểm tra regex
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API Proxy with ^~ so regex static caching doesn't intercept /api/media/*.png
    location ^~ /api/ {
        set $backend_upstream yin-backend-api:8080;
        proxy_pass http://$backend_upstream;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $yin_forwarded_proto;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Chức năng đang bị lỗi hệ thống. Vui lòng thử lại sau."}';
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bắt buộc kiểm tra Whitelist:
    # Nếu không nằm trong danh sách routes/sitemap/assets được phép -> Trả về 410 Gone
    # Nếu nằm trong Whitelist -> Phục vụ Angular SPA
    location / {
        if ($is_allowed_route = 0) {
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            return 410;
        }
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
