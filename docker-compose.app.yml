# ==============================================================================
# YIN TECHNOLOGY PLATFORM - DOCKER APPLICATION STACK
# Angular/Nginx và Spring Boot API, sử dụng PostgreSQL trên yin-network
# Cách chạy: docker compose -f docker-compose.app.yml up -d
# ==============================================================================

services:
  yin-backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yin-backend-api
    restart: always
    environment:
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      POSTGRES_HOST: yin-postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yin_db}
      POSTGRES_USER: ${POSTGRES_USER:-yin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      REDIS_HOST: yin-redis
      REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      MEDIA_STORAGE_DIR: /app/media
    volumes:
      - yin_media:/app/media
    mem_limit: 704m
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - yin-network

  yin-frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yin-frontend-web
    restart: always
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4200}:80"
    networks:
      - yin-network
    mem_limit: 96m

networks:
  yin-network:
    name: yin-network
    driver: bridge

volumes:
  yin_media:

