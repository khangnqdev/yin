services:
  yin-postgres-db:
    image: postgres:17-alpine
    container_name: yin-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yin_db}
      POSTGRES_USER: ${POSTGRES_USER:-yin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yin_postgres_data:/var/lib/postgresql/data
    networks:
      - yin-network
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  yin_postgres_data:
    name: yin_postgres_data

networks:
  yin-network:
    name: yin-network
    driver: bridge
