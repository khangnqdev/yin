# ==============================================================================
# YIN TECHNOLOGY PLATFORM - DOCKER INFRASTRUCTURE STACK
# Chuyên trách hạ tầng Database (Microsoft SQL Server 2022) tách biệt với Web App
# Cách chạy: docker compose -f docker-compose.infra.yml up -d
# ==============================================================================

services:
  yin-mssql-volume-permissions:
    image: alpine:3.20
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:0 /data /log /secrets"]
    volumes:
      - yin_mssql_data:/data
      - yin_mssql_log:/log
      - yin_mssql_secrets:/secrets

  yin-mssql-db:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: yin-mssql-db
    restart: always
    depends_on:
      yin-mssql-volume-permissions:
        condition: service_completed_successfully
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - yin_mssql_data:/var/opt/mssql/data
      - yin_mssql_log:/var/opt/mssql/log
      - yin_mssql_secrets:/var/opt/mssql/secrets
    networks:
      - yin-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  yin_mssql_data:
    name: ${MSSQL_DATA_VOLUME:-yin_mssql_data}
  yin_mssql_log:
    name: yin_mssql_log
  yin_mssql_secrets:
    name: yin_mssql_secrets

networks:
  yin-network:
    name: yin-network
    driver: bridge

