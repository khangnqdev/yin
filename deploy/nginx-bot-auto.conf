location = /bot-auto {
    return 308 /bot-auto/;
}

location ^~ /bot-auto/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8766;
    proxy_set_header Origin $yin_bot_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # The existing bot UI uses root-relative assets and API paths.
    sub_filter_once off;
    sub_filter_types text/javascript;
    sub_filter 'href="/style.css"' 'href="/bot-auto/style.css"';
    sub_filter 'src="/app.js"' 'src="/bot-auto/app.js"';
    sub_filter "fetch('/api/'" "fetch('/bot-auto/api/'";
}
